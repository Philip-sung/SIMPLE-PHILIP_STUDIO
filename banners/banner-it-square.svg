<?xml version="1.0" encoding="UTF-8"?>
<!-- PHILIP STUDIO 정사각 배너 · IT 트랙 (명함 앞면 브랜드 면의 1:1 버전)
     디지털용(프로필·SNS·썸네일) — 재단여유·가이드 없음. 기본 출력 1080 x 1080 px.
     단위: viewBox 100 x 100. 색·도형은 namecard-it-front.svg 와 동일. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 100 100">
  <title>PHILIP STUDIO — IT Square Banner</title>
  <defs>
    <clipPath id="emblemClip"><circle cx="18" cy="22" r="7"/></clipPath>
    <clipPath id="orbClip"><circle cx="80" cy="50" r="18"/></clipPath>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <g id="background">
    <rect x="0" y="0" width="100" height="100" fill="#FFFFFF"/>
  </g>

  <!-- ===== GEOMETRY : 명함 도형을 1.2배로 옮겨 우하단 모서리에 맞춤 (명함 좌표 89,59 → 100,100) ===== -->
  <g id="geometry" transform="translate(-6.8 29.2) scale(1.2)">
    <circle cx="80" cy="50" r="18" fill="#CEDEF2"/>
    <g clip-path="url(#orbClip)">
      <path d="M 62 59 L 62 51 A 14 14 0 0 1 90 51 L 90 59 Z" fill="#A0C4F2"/>
      <path d="M 67 59 L 67 51 A 9 9 0 0 1 85 51 L 85 59 Z" fill="#6DA7F2"/>
      <path d="M 71.5 59 L 71.5 51 A 4.5 4.5 0 0 1 80.5 51 L 80.5 59 Z" fill="#035AA6"/>
    </g>

    <path d="M 49.5 59 L 49.5 54 A 5.5 5.5 0 0 1 60.5 54 L 60.5 59 Z" fill="#A0C4F2"/>
    <path d="M 52.2 59 L 52.2 54 A 2.8 2.8 0 0 1 57.8 54 L 57.8 59 Z" fill="#035AA6"/>

    <path d="M -8 59 L -8 54 A 8 8 0 0 1 8 54 L 8 59 Z" fill="#CEDEF2"/>
    <path d="M -4 59 L -4 54 A 4 4 0 0 1 4 54 L 4 59 Z" fill="#A0C4F2"/>
  </g>

  <!-- ===== EMBLEM : 명함 엠블럼을 중앙 상단으로 확대 (r 7 → 12, 중심 50,34) ===== -->
  <g id="emblem" transform="translate(50 34) scale(1.7143) translate(-18 -22)">
    <g clip-path="url(#emblemClip)">
      <path d="M 12.8 25.5 L 12.8 24 A 5.2 5.2 0 0 1 23.2 24 L 23.2 25.5 Z" fill="#6DA7F2"/>
      <path d="M 14.7 25.5 L 14.7 24 A 3.3 3.3 0 0 1 21.3 24 L 21.3 25.5 Z" fill="#035AA6"/>
      <path d="M 16.5 25.5 L 16.5 24 A 1.5 1.5 0 0 1 19.5 24 L 19.5 25.5 Z" fill="#023373"/>
      <line x1="11" y1="25.5" x2="25" y2="25.5" stroke="#023373" stroke-width="0.3"/>
    </g>
    <circle cx="18" cy="22" r="7" fill="none" stroke="#023373" stroke-width="0.4"/>
  </g>

  <!-- ===== WORDMARK : 세로 스택 중앙 정렬 ===== -->
  <g id="wordmark" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">
    <text x="50.6" y="58" font-size="6.2" font-weight="700" letter-spacing="1.3" fill="#023373">PHILIP STUDIO</text>
    <text x="50.4" y="64.6" font-size="2.6" font-weight="500" letter-spacing="0.8" fill="#035AA6">WEB · APP · AI ENGINEERING</text>
  </g>
</svg>
