<?xml version="1.0" encoding="UTF-8"?>
<!-- PHILIP STUDIO 정사각 배너 · 건축 트랙 (명함 앞면의 1:1 버전)
     디지털용(프로필·SNS·썸네일) — 재단여유·가이드 없음. 기본 출력 1080 x 1080 px.
     단위: viewBox 100 x 100. 색·모티프는 namecard-architecture-front.svg 와 동일. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 100 100">
  <title>PHILIP STUDIO — Architecture Square Banner</title>

  <!-- ===== BACKGROUND ===== -->
  <g id="background">
    <rect x="0" y="0" width="100" height="100" fill="#0A3711"/>
  </g>

  <!-- ===== FRAME &amp; EXTENDING LINES ===== -->
  <g id="frame" stroke="#C9A227" fill="none">
    <rect x="12" y="12" width="76" height="76" stroke-width="0.3"/>
    <line x1="0"  y1="12" x2="100" y2="12" stroke-width="0.15" opacity="0.45"/>
    <line x1="0"  y1="88" x2="100" y2="88" stroke-width="0.15" opacity="0.45"/>
    <line x1="12" y1="0"  x2="12" y2="100" stroke-width="0.15" opacity="0.45"/>
    <line x1="88" y1="0"  x2="88" y2="100" stroke-width="0.15" opacity="0.45"/>
  </g>

  <!-- ===== TEXT ===== -->
  <g id="text" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
    <text x="50" y="49.4" text-anchor="middle" font-size="5.4" font-weight="700"
          letter-spacing="1.6" fill="#C9A227">PHILIP STUDIO</text>
    <line x1="38" y1="53.4" x2="62" y2="53.4" stroke="#C9A227" stroke-width="0.25"/>
    <text x="50" y="58.8" text-anchor="middle" font-size="2.3" font-weight="500"
          letter-spacing="1.3" fill="#D9B84D">INTERIOR · ARCHITECTURE</text>
  </g>
</svg>
